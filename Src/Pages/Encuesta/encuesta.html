<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>Encuesta de Satisfacción</title>

    <!-- SweetAlert2 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@10/dist/sweetalert2.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@10"></script>

    <!-- Bootstrap 4.3.1 -->
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css" />
    <link rel="stylesheet" href="../../../Assets/Css/Encuesta/style.css" />

    <!-- Config + lógica JS -->
    <script src="../../../config.js"></script>
    <script src="../../../security/seguridad.js" defer></script>
    <script src="encuesta.js" defer></script>
    <script src="../../Php/Encuesta/guardarEncuesta.js" defer></script>
</head>

<body>
<p id="rolUsuario" style="font-weight: bold; margin-bottom: 10px;"></p>

<div class="container mt-4">
    <h2 class="text-center mb-4">Encuesta de Satisfacción</h2>

    <form id="formEncuesta">
        <div class="form-group">
            <label for="nombre">Nombre:</label>
            <input type="text" class="form-control" id="nombre" required autocomplete="off" />
        </div>

        <div class="form-group">
            <label for="celular">Número de Celular:</label>
            <input type="tel" class="form-control" id="celular" required autocomplete="off" />
        </div>

        <div class="form-group">
            <label for="placa">Placa del Vehículo:</label>
            <input type="text" class="form-control" id="placa" oninput="this.value = this.value.toUpperCase()" required autocomplete="off" />
        </div>

        <div class="form-group">
            <label for="sede">¿En cuál sede estás? Selecciona abajo:</label>
            <select id="sede" class="form-control" required>
                <option value="" disabled selected>Presiona aquí para seleccionar una sede</option>
            </select>
        </div>

        <div class="form-group text-center">
            <label>¿Cómo fue la atención recibida en general?</label>
            <div class="d-flex justify-content-around">
                <button type="button" class="btn btn-success btn-lg btn-circle btn-opcion" onclick="seleccionarOpcion('excelente', 1)" id="btnExcelente">
                    <img src="../../../Assets/Img/contento.png" alt="Excelente" width="40" />
                </button>
                <button type="button" class="btn btn-warning btn-lg btn-circle btn-opcion" onclick="seleccionarOpcion('serio', 0.5)" id="btnSerio">
                    <img src="../../../Assets/Img/serio.png" alt="Regular" width="40" />
                </button>
                <button type="button" class="btn btn-danger btn-lg btn-circle btn-opcion" onclick="seleccionarOpcion('malo', 0)" id="btnMalo">
                    <img src="../../../Assets/Img/infeliz.png" alt="Malo" width="40" />
                </button>
            </div>
        </div>

        <div class="form-group">
            <label for="comentarios">Comentarios adicionales:</label>
            <textarea class="form-control" id="comentarios" rows="4" autocomplete="off"></textarea>
        </div>

        <div class="text-center mb-3">
            <label for="labelCalificacion">Tu calificación:</label>
            <p id="labelCalificacion" class="fw-bold"></p>
        </div>

        <input type="hidden" id="atencion" />

        <button type="submit" class="btn btn-primary btn-block">Enviar Encuesta</button>
    </form>
</div>

<!-- Bootstrap JS -->
<script src="https://code.jquery.com/jquery-3.3.1.slim.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.14.7/umd/popper.min.js"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js"></script>
</body>
</html>
